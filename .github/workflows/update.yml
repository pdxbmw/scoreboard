name: Update Scores
on:
  schedule:
    - cron: '0 * * * *' # Runs every hour on the hour
  workflow_dispatch: # Allows you to manually trigger it from GitHub UI

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install libraries
        run: pip install requests

      - name: Fetch Data
        run: python scripts/fetch_scores.py

      - name: Commit and Push
        run: |
          git config --global user.name "ScoreBot"
          git config --global user.email "bot@noreply.github.com"
          # scores + league-scoped team schedules (needed because ESPN team APIs
          # often omit CORS headers when called from GitHub Pages)
          git add data/scores.json data/teams/sports
          if git diff --staged --quiet; then
            echo "No score changes to commit"
            exit 0
          fi
          git commit -m "Auto-update scores"
          # main may move while this job runs; rebase and retry push
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "Pushed successfully"
              exit 0
            fi
            echo "Push failed (attempt $attempt); rebasing onto origin/main..."
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 2))
          done
          echo "Failed to push after retries"
          exit 1
