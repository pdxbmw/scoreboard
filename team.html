<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team History</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Fredoka', sans-serif; background: #f4f7f6; margin: 0; padding: 0; }
        
        /* Dynamic Header */
        .header {
            background: var(--team-color, #333); color: white; padding: 30px 20px;
            text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.2); position: sticky; top: 0; z-index: 100;
        }

        .header h1 { margin: 10px 0 5px 0; font-size: 2.5rem; }
        .header-content { display: flex; flex-direction: column; align-items: center; justify-content: center; margin: 0 auto; padding-left: 80px; padding-right: 80px; }
        .back-btn { 
            position: absolute; top: 20px; left: 20px; background: rgba(255,255,255,0.2); 
            color: white; border: none; padding: 8px 15px; border-radius: 20px; font-weight: bold; cursor: pointer;
            text-decoration: none; font-size: 1rem;
        }

        /* List of Games */
        .game-list { max-width: 600px; margin: 20px auto; padding: 0 15px; }
        .game-row {
            background: white; border-radius: 15px; padding: 15px; margin-bottom: 12px;
            display: flex; align-items: center; justify-content: space-between;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .game-date { font-size: 0.8rem; color: #888; width: 80px; white-space: nowrap; }
        .opponent { display: flex; align-items: center; justify-content: center; gap: 10px; flex: 1; }
        .opponent img { width: 40px; height: 40px; object-fit: contain; }
        .opponent-name { font-weight: bold; color: #333; }
        .result { font-size: 1.2rem; font-weight: bold; width: 80px; text-align: right; white-space: nowrap; }
        
        .win { color: #2e7d32; } /* Green */
        .loss { color: #c62828; } /* Red */
        .future { color: #555; font-size: 0.9rem; }
    </style>
</head>
<body>

    <div class="header" id="header">
        <a href="index.html" class="back-btn">← Back</a>
        <div class="header-content">
            <h1 id="teamName">Loading...</h1>
            <div id="teamRecord" style="font-size: 1rem; opacity: 0.9;"></div>
        </div>
    </div>

    <div class="game-list" id="games">
        <p align="center">Fetching full season history...</p>
    </div>

    <script>
        // Parse URL params
        const params = new URLSearchParams(window.location.search);
        let TEAM_ID = params.get('id');
        const COLOR = decodeURIComponent(params.get('color') || '');
        const NAME = params.get('name');
        const LEAGUE = (params.get('league') || 'nba').toLowerCase();
        const RETURN_TO = params.get('return');

        // Apply Theme
        document.getElementById('header').style.setProperty('--team-color', COLOR || '#333');
        const teamNameEl = document.getElementById('teamName');
        if (teamNameEl) {
            // Insert space between rank token (e.g., #3) and name if missing
            const displayName = NAME || "Team Schedule";
            const spaced = displayName.replace(/^(#\d+)([^\s#]+)/, '$1 $2');
            teamNameEl.innerText = spaced;
        }
        const backBtn = document.querySelector('.back-btn');
        if (backBtn && RETURN_TO) backBtn.setAttribute('href', decodeURIComponent(RETURN_TO));

        let refreshTimer;

        // ESPN team IDs collide across sports — always resolve by league key
        const LEAGUE_META = {
            nfl: { sport: 'football', slug: 'nfl' },
            ncaa_fb: { sport: 'football', slug: 'college-football' },
            nba: { sport: 'basketball', slug: 'nba' },
            wnba: { sport: 'basketball', slug: 'wnba' },
            ncaa_mb: { sport: 'basketball', slug: 'mens-college-basketball' },
            ncaa_wb: { sport: 'basketball', slug: 'womens-college-basketball' }
        };

        const sameId = (a, b) => String(a ?? '') === String(b ?? '');

        function getLeagueMeta() {
            return LEAGUE_META[LEAGUE] || null;
        }

        function leaguePathFromMeta(meta) {
            return `${meta.sport}/${meta.slug}`;
        }

        async function resolveTeamIdByName(force = false) {
            // ESPN /teams list endpoints omit CORS headers from github.io, so name
            // resolution is best-effort via the CORS-friendly schedule endpoint only
            // when we already have a candidate id.
            if (!NAME || !TEAM_ID || !force) return;
        }

        async function fetchTeamFromAPI() {
            if (!TEAM_ID) return null;
            const leagueMeta = getLeagueMeta();
            if (!leagueMeta) {
                console.warn('Unknown league key:', LEAGUE);
                return null;
            }
            // Important: /teams/{id} is not CORS-enabled from github.io, but
            // /teams/{id}/schedule is — and it already includes team.recordSummary.
            const scheduleUrl = `https://site.api.espn.com/apis/site/v2/sports/${leaguePathFromMeta(leagueMeta)}/teams/${TEAM_ID}/schedule`;
            try {
                const scheduleRes = await fetch(scheduleUrl);
                if (!scheduleRes.ok) throw new Error(`HTTP ${scheduleRes.status}`);
                const schedJson = await scheduleRes.json();
                const teamRecord = schedJson.team?.recordSummary || schedJson.team?.record?.items?.[0]?.summary || '';
                const events = (schedJson?.events || schedJson?.team?.events || []).filter(ev => {
                    const comp = ev.competitions?.[0];
                    const hasTeam = comp?.competitors?.some(c => sameId(c.team?.id, TEAM_ID));
                    return hasTeam && matchesLeague(ev);
                });
                return { teamRecord, events };
            } catch (e) {
                console.log('API fallback failed:', e);
                return null;
            }
        }

        async function fetchTeamFromScoresJson() {
            // Local fallback built from scraped scoreboard data (always same-origin).
            try {
                const res = await fetch('data/scores.json?t=' + Date.now());
                if (!res.ok) return null;
                const data = await res.json();
                const events = [];
                let teamRecord = '';
                for (const [dayKey, games] of Object.entries(data || {})) {
                    if (!Array.isArray(games)) continue;
                    for (const game of games) {
                        if (LEAGUE && game.league_key && game.league_key !== LEAGUE) continue;
                        const home = game.home || {};
                        const away = game.away || {};
                        if (!sameId(home.id, TEAM_ID) && !sameId(away.id, TEAM_ID)) continue;
                        if (!teamRecord) {
                            const mine = sameId(home.id, TEAM_ID) ? home : away;
                            teamRecord = mine.record || '';
                        }
                        const homeColor = (home.color || '#333333').replace(/^#/, '');
                        const awayColor = (away.color || '#333333').replace(/^#/, '');
                        // dayKey is YYYYMMDD from the scraper
                        const isoDate = /^\d{8}$/.test(dayKey)
                            ? `${dayKey.slice(0,4)}-${dayKey.slice(4,6)}-${dayKey.slice(6,8)}T17:00:00Z`
                            : (game.date || game.date_label);
                        events.push({
                            date: isoDate,
                            competitions: [{
                                status: { type: { completed: !!game.completed, shortDetail: game.status } },
                                competitors: [
                                    {
                                        homeAway: 'home',
                                        score: { value: Number(home.score) || 0, displayValue: String(home.score ?? '') },
                                        team: {
                                            id: String(home.id),
                                            displayName: home.name,
                                            shortDisplayName: home.name,
                                            abbreviation: home.name,
                                            color: homeColor,
                                            logos: home.logo ? [{ href: home.logo }] : []
                                        }
                                    },
                                    {
                                        homeAway: 'away',
                                        score: { value: Number(away.score) || 0, displayValue: String(away.score ?? '') },
                                        team: {
                                            id: String(away.id),
                                            displayName: away.name,
                                            shortDisplayName: away.name,
                                            abbreviation: away.name,
                                            color: awayColor,
                                            logos: away.logo ? [{ href: away.logo }] : []
                                        }
                                    }
                                ]
                            }]
                        });
                    }
                }
                if (!events.length) return null;
                return { teamRecord, events };
            } catch (e) {
                console.log('scores.json fallback failed:', e);
                return null;
            }
        }

        const formatLocal = (iso) => {
            const d = new Date(iso);
            if (isNaN(d.getTime())) return { dateStr: '', timeStr: '' };
            const dateStr = `${d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' })}, ${d.getFullYear()}`;
            const timeStr = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            return { dateStr, timeStr };
        };

        const matchesLeague = (ev) => {
            if (!LEAGUE) return true;

            const normalizeAbbr = (abbr) => (abbr || '').toLowerCase();

            const explicit = (ev.league_key || '').toLowerCase();
            if (explicit) return explicit === LEAGUE;

            const comp = ev.competitions?.[0];
            const leagueAbbr = normalizeAbbr(comp?.league?.abbreviation || ev.leagues?.[0]?.abbreviation);

            // League-aware ESPN schedule endpoints already scope by sport/league
            if (!leagueAbbr) return true;

            if (LEAGUE === 'nfl') return leagueAbbr === 'nfl';
            if (LEAGUE === 'ncaa_fb') return leagueAbbr.includes('college') || leagueAbbr === 'ncaaf' || leagueAbbr === 'cfb' || leagueAbbr === 'ncaa';
            if (LEAGUE === 'nba') return leagueAbbr === 'nba';
            if (LEAGUE === 'wnba') return leagueAbbr === 'wnba';
            if (LEAGUE === 'ncaa_mb') return leagueAbbr.includes('college') || leagueAbbr.includes('ncaa') || leagueAbbr === 'ncaab' || leagueAbbr === 'ncb' || leagueAbbr === 'mbb';
            if (LEAGUE === 'ncaa_wb') return leagueAbbr.includes('women') || leagueAbbr.includes('ncaa') || leagueAbbr === 'ncaaw' || leagueAbbr === 'wbb';

            return false;
        };

        function localTeamNameMatches(data) {
            if (!NAME) return true;
            const team = data?.team || {};
            const norm = (s) => (s || '').toLowerCase().trim();
            const target = norm(NAME);
            return [team.displayName, team.shortDisplayName, team.name, team.nickname, team.abbreviation]
                .some(v => norm(v) === target || (target && norm(v).includes(target)));
        }

        async function loadHistory() {
            if (!TEAM_ID) {
                console.warn('Missing TEAM_ID');
                showNoGames();
                return;
            }
            const leagueMeta = getLeagueMeta();
            if (!leagueMeta) {
                console.warn('Unknown league key:', LEAGUE);
                showNoGames();
                return;
            }
            const urlNew = `data/teams/sports/${leagueMeta.sport}/${leagueMeta.slug}/${TEAM_ID}.json`;
            // Legacy flat files are not league-scoped (id 27 is Bucs AND Wizards) — only use as a last local hint
            const urlLegacy = `data/teams/${TEAM_ID}.json`;
            console.log('Trying league-aware path:', urlNew, 'league=', LEAGUE);
            
            try {
                let res = await fetch(urlNew);
                console.log('Response (league-aware) status:', res.status);
                let events = [];
                let teamRecord = '';
                let usedLocal = false;

                if (res.ok) {
                    const data = await res.json();
                    const dataLeague = (data.league_key || data.league || '').toLowerCase();
                    const leagueMismatch = dataLeague && dataLeague !== LEAGUE;

                    if (leagueMismatch) {
                        console.log('Local data league mismatch, skipping local events');
                    } else {
                        events = (data.events || []).filter(ev => {
                            const comp = ev.competitions?.[0];
                            const hasTeam = comp?.competitors?.some(c => sameId(c.team?.id, TEAM_ID));
                            return hasTeam && matchesLeague(ev);
                        });
                        teamRecord = data.team?.recordSummary || '';
                        usedLocal = events.length > 0;
                    }
                } else {
                    // Only accept legacy file if the team name matches this page's league context
                    console.log('League-aware file missing; checking legacy path carefully:', urlLegacy);
                    const legacyRes = await fetch(urlLegacy);
                    if (legacyRes.ok) {
                        const data = await legacyRes.json();
                        if (localTeamNameMatches(data)) {
                            events = (data.events || []).filter(ev => {
                                const comp = ev.competitions?.[0];
                                return comp?.competitors?.some(c => sameId(c.team?.id, TEAM_ID));
                            });
                            teamRecord = data.team?.recordSummary || '';
                            usedLocal = events.length > 0;
                        } else {
                            console.log('Legacy file is a different sport/team; ignoring', data?.team?.displayName);
                        }
                    }
                }

                // Local league files first; then scores.json (same-origin); ESPN last
                // because ESPN CORS headers are inconsistent from github.io.
                if (!usedLocal || !teamRecord) {
                    console.log('Local league file missing/empty, trying scores.json for', LEAGUE);
                    let apiData = await fetchTeamFromScoresJson();
                    if (!apiData?.events?.length) {
                        console.log('scores.json miss, trying ESPN schedule for', LEAGUE);
                        apiData = await fetchTeamFromAPI();
                    }
                    if (apiData && apiData.events?.length) {
                        events = apiData.events;
                        teamRecord = apiData.teamRecord || teamRecord || '';
                    } else if (apiData?.teamRecord) {
                        teamRecord = apiData.teamRecord;
                    }
                }

                let filteredEvents = (events || []).filter(ev => {
                    const comp = ev.competitions?.[0];
                    const hasTeam = comp?.competitors?.some(c => sameId(c.team?.id, TEAM_ID));
                    return hasTeam && matchesLeague(ev);
                });

                if (!filteredEvents.length) {
                    const prevId = TEAM_ID;
                    await resolveTeamIdByName(true);
                    if (TEAM_ID && TEAM_ID !== prevId) {
                        return loadHistory();
                    }
                }

                document.getElementById('teamRecord').innerText = teamRecord || 'Season Record';

                if (!filteredEvents.length) {
                    showNoGames();
                } else {
                    renderGames(filteredEvents);
                }

                if (refreshTimer) clearTimeout(refreshTimer);
                if (filteredEvents.length) {
                    refreshTimer = setTimeout(loadHistory, 20000);
                }
            } catch(e) {
                console.error('Error loading team data:', e);
                let apiData = await fetchTeamFromAPI();
                if (!apiData?.events?.length) {
                    apiData = await fetchTeamFromScoresJson();
                }
                if (apiData) {
                    const filteredEvents = (apiData.events || []).filter(ev => {
                        const comp = ev.competitions?.[0];
                        const hasTeam = comp?.competitors?.some(c => sameId(c.team?.id, TEAM_ID));
                        return hasTeam && matchesLeague(ev);
                    });
                    document.getElementById('teamRecord').innerText = apiData.teamRecord || 'Season Record';
                    if (!filteredEvents.length) {
                        showNoGames();
                    } else {
                        renderGames(filteredEvents);
                    }
                } else {
                    showNoGames();
                }
            }
        }

        function showNoGames() {
            const friendlyImg = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='180' viewBox='0 0 220 180'><rect width='220' height='180' rx='24' ry='24' fill='%23f5f7fb'/><circle cx='110' cy='85' r='52' fill='%23fff' stroke='%23d33' stroke-width='4'/><circle cx='90' cy='78' r='7' fill='%23d33'/><circle cx='130' cy='78' r='7' fill='%23d33'/><path d='M82 112c12-10 44-10 56 0' stroke='%23d33' stroke-width='6' fill='none' stroke-linecap='round'/></svg>";
            document.getElementById('games').innerHTML = `
                <div style='text-align:center; color:#444; font-size:1.05rem; padding:24px;'>
                    <img src="${friendlyImg}" alt="No games" style="width:180px; max-width:80%; display:block; margin:0 auto 10px auto;" />
                    <div style="margin-top:8px; font-weight:800;">No games here</div>
                    <div style="margin-top:4px; font-size:1rem; color:#666;">Try another team.</div>
                </div>`;
        }

        async function getOpponentRecord(opponentId) {
            const leagueMeta = getLeagueMeta();
            const candidates = [];
            if (leagueMeta) {
                candidates.push(`data/teams/sports/${leagueMeta.sport}/${leagueMeta.slug}/${opponentId}.json`);
            }
            candidates.push(`data/teams/${opponentId}.json`);
            for (const url of candidates) {
                try {
                    const res = await fetch(url);
                    if (!res.ok) continue;
                    const data = await res.json();
                    const record = data.team?.recordSummary;
                    if (record) return record;
                } catch (e) {
                    console.log('Could not fetch opponent record for', opponentId, e);
                }
            }
            return '';
        }

        async function renderGames(events) {
            const container = document.getElementById('games');
            container.innerHTML = '';
            
            // Sort events by date (oldest first for chronological order)
            events.sort((a, b) => new Date(a.date) - new Date(b.date));
            
            for (const event of events) {
                const game = event.competitions && event.competitions[0];
                if (!game) {
                    console.warn('No competition data for event:', event);
                    continue;
                }
                
                const opponent = game.competitors && game.competitors.find(c => c.team && !sameId(c.team.id, TEAM_ID));
                const myTeam = game.competitors && game.competitors.find(c => c.team && sameId(c.team.id, TEAM_ID));
                
                if (!opponent || !myTeam) {
                    console.warn('Missing team data for event:', event);
                    continue;
                }
                
                const { dateStr, timeStr } = formatLocal(event.date);
                
                const div = document.createElement('div');
                div.className = 'game-row';

                let resultHTML = "";
                const isCompleted = game.status && game.status.type && game.status.type.completed;
                
                if (isCompleted) {
                    const myScore = parseInt(myTeam.score?.value ?? myTeam.score ?? 0, 10);
                    const opScore = parseInt(opponent.score?.value ?? opponent.score ?? 0, 10);
                    const isWin = myScore > opScore;
                    
                    resultHTML = `<span class="result ${isWin ? 'win' : 'loss'}">
                        ${isWin ? 'W' : 'L'} ${myScore}-${opScore}
                    </span>`;
                } else {
                    resultHTML = `<span class="result future">${timeStr}</span>`;
                }

                const opponentRecord = await getOpponentRecord(opponent.team.id);

                const oppColor = opponent.team?.color ? `#${opponent.team.color}` : '#333';
                const oppName = opponent.team?.displayName || opponent.team?.shortDisplayName || opponent.team?.abbreviation || 'Team';
                const oppHref = `team.html?id=${encodeURIComponent(opponent.team.id)}&league=${encodeURIComponent(LEAGUE)}&color=${encodeURIComponent(oppColor)}&name=${encodeURIComponent(oppName)}`;
                
                div.innerHTML = `
                    <span class="game-date">${dateStr}</span>
                    <div class="opponent" onclick="location.href='${oppHref}'" style="cursor:pointer;">
                        <img src="${opponent.team.logos?.[0]?.href || ''}">
                        <div>
                            <span class="opponent-name">${opponent.team.abbreviation || opponent.team.shortDisplayName || 'Unknown'}</span>
                            ${opponentRecord ? `<div class="record">${opponentRecord}</div>` : ''}
                        </div>
                    </div>
                    ${resultHTML}
                `;
                container.appendChild(div);
            }
        }

        loadHistory();
    </script>
</body>
</html>
